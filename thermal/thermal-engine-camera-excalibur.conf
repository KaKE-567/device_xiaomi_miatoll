# SENSOR : ALIAS
# High Performance Gaming Thermal Configuration for Xiaomi Miatoll (Zedex OS)

[SS-QUIET-THERMAL-S1]
algo_type ss
sampling 5000
sensor nvm-therm-usr
device cpu0
set_point 75000
set_point_clr 70000
time_constant 0
device_max_limit 1804800

[SS-QUIET-THERMAL-G1]
algo_type ss
sampling 5000
sensor nvm-therm-usr
device cpu6
set_point 75000
set_point_clr 70000
time_constant 0
device_max_limit 2304000

[LCD_MONITOR]
algo_type monitor
sampling 5000
sensor backlight_therm
thresholds 58000 65000 75000
thresholds_clr 55000 62000 70000
actions lcd lcd lcd
action_info 409 614 819

[BATTERY_CHARGING_STL]
algo_type monitor
sampling 1000
sensor quiet-therm-usr
thresholds 42000 44000 46000 48000 50000 52000 55000
thresholds_clr 40000 42000 44000 46000 48000 50000 53000
actions battery battery battery battery battery battery battery
action_info 1 2 3 4 5 6 8

[LCD_MONITOR_STATE]
algo_type monitor
sampling 5000
sensor quiet-therm-usr
thresholds 75000
thresholds_clr 70000
actions lcd
action_info 3685

[CPU_HOTPLUG_MONITOR]
algo_type monitor
sampling 5000
sensor quiet-therm-usr
thresholds 85000
thresholds_clr 80000
actions hotplug_1+hotplug_2+hotplug_3+hotplug_4+hotplug_5+hotplug_6
action_info 1+1+1+1+1+1

[HIGH_TEMP_STATE]
algo_type monitor
sampling 5000
sensor quiet-therm-usr
thresholds 80000
thresholds_clr 75000
actions temp_state
action_info 4
