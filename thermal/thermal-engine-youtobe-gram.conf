# SENSOR : ALIAS
# Ultimate Gaming & Benchmark Zero-Throttle Thermal Profile for Xiaomi Miatoll (Zedex OS)

[SS-QUIET-THERMAL-S1]
algo_type ss
sampling 5000
sensor nvm-therm-usr
device cpu0
set_point 95000
set_point_clr 90000
time_constant 0
device_max_limit 1804800

[SS-QUIET-THERMAL-G1]
algo_type ss
sampling 5000
sensor nvm-therm-usr
device cpu6
set_point 95000
set_point_clr 90000
time_constant 0
device_max_limit 2323200

[LCD_MONITOR]
algo_type monitor
sampling 5000
sensor backlight_therm
thresholds 75000 80000 90000
thresholds_clr 70000 75000 85000
actions lcd lcd lcd
action_info 409 614 819

[BATTERY_CHARGING_STL]
algo_type monitor
sampling 1000
sensor quiet-therm-usr
thresholds 50000 52000 55000 58000 60000 62000 65000
thresholds_clr 48000 50000 53000 56000 58000 60000 63000
actions battery battery battery battery battery battery battery
action_info 1 2 3 4 5 6 8

